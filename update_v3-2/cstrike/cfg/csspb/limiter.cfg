// Sets Kill Limit of CSSDM mode.
// --
// Default: "100"
sm_kill_limit 30

// Sets Round Limit of CSS:BM mode.
// --
// Default: "9"
sm_round_limit 3

// Show Progress Bar of CSS:DM Protection
//--
// 0 = No. 1 = Yes.
// --
// Default: "0"
sm_dm_protectnotif 0

// Sets Overview (death-radar) to None 
// --
// 0 = None (not view death-radar); 1 = Medium (like a live-radar but cant customize lol); 2 = Big (entire screen) 
// --
// Default: "0"
overview_mode 0

// Sets Kill Assist Cash to 100
// --
// Default: "100"
kassist_cash 70

// Sets Assist Log in Chat
// --
// 1=Yes (basic, short, assister only), 2=Yes (advanced, short, assister, killer and victim), 3=Yes (basic, long, assister only), 4=Yes (advanced, long, assister, killer and victim). Default 0=disabled
// --
// Default: "0"
kassist_log 0

// Write in logs that there is an assist even if the assister helped kill a teammate.
// --
// 1=Yes, 0=No.
// --
// Default: "0"
kassist_log_teamkill 0

// Not Quitting game after round ended.
// --
// 1=Yes, 0=No.
// --
// Default: "1"
sm_classic_csmode 0

// x seconds to preparing match
// --
// x sec
// --
// Default: "5"
sm_cdmatch 5

//weapon config
sm_current_primary auga3
sm_current_secondary glock
sm_current_melee knife
sm_current_grenade 1
sm_current_flashbang 0
sm_current_smokegrenade 1

// set aspect ratio, only take effect on hud. not the css settings
// --
// 16:9 or 4:3
// --
// Default: "16:9"
sm_aspect_ratio 16:9

//control mode from here
cssdm_enabled 1

//wajib on di pb mode
mp_roundtime 3
bot_quota 7
bot_difficulty 2
bot_chatter radio
mp_startmoney 16000
mp_buytime 10
mp_freezetime 1
mp_timelimit 60
mp_forcecamera 1
cl_crosshairdot 1
cl_crosshairsize 0
cl_crosshairthickness 2.25

